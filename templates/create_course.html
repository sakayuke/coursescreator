{% extends "base.html" %}

{% block title %}Create Course{% endblock %}

{% block content %}

<div class="page-header">
    <div>
        <h1>Create Course</h1>
        <p>Create a new course for the platform.</p>
    </div>
</div>

<div class="form-card">
    <form method="POST">


    <div class="form-group">
        <label for="name">Course name</label>
        <input
            id="name"
            type="text"
            name="name"
            required
        >
    </div>

    <div class="form-group">
        <label for="description">Description</label>
        <textarea
            id="description"
            name="description"
        ></textarea>
    </div>

    {% if current_user.role in ("admin", "superadmin") %}
    <div class="form-group">
        <label for="teacher_id">Teacher</label>

        <select
            id="teacher_id"
            name="teacher_id"
            required
        >
            {% for teacher in teachers %}
            <option value="{{ teacher.id }}">
                {{ teacher.email }}
            </option>
            {% endfor %}
        </select>
    </div>
    {% endif %}

    <div class="form-actions">
        <button
            type="submit"
            class="button button-primary"
        >
            Create Course
        </button>

        <a
            href="{{ url_for('courses') }}"
            class="button button-secondary"
        >
            Back to Courses
        </a>
    </div>

</form>


</div>
{% endblock %}
