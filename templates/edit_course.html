{% extends "base.html" %}

{% block title %}Edit Course{% endblock %}

{% block content %}

<div class="page-header">
    <div>
        <h1>Edit Course</h1>
        <p>Update course information and settings.</p>
    </div>
</div>

<div class="form-card">
    <form method="POST">


    <div class="form-group">
        <label for="name">Course name</label>

        <input
            id="name"
            type="text"
            name="name"
            value="{{ course.name }}"
            required
        >
    </div>

    <div class="form-group">
        <label for="description">Description</label>

        <textarea
            id="description"
            name="description"
        >{{ course.description }}</textarea>
    </div>

    {% if current_user.role == "admin" %}
    <div class="form-group">
        <label for="teacher_id">Teacher</label>

        <select
            id="teacher_id"
            name="teacher_id"
            required
        >
            {% for teacher in teachers %}
            <option
                value="{{ teacher.id }}"
                {% if teacher.id == course.teacher_id %}selected{% endif %}
            >
                {{ teacher.email }}
            </option>
            {% endfor %}
        </select>
    </div>
    {% endif %}

    <div class="form-actions">
        <button
            type="submit"
            class="button button-primary"
        >
            Save Changes
        </button>

        <a
            href="{{ url_for('courses') }}"
            class="button button-secondary"
        >
            Back to Courses
        </a>
    </div>

</form>


</div>
{% endblock %}
