
{% extends "base.html" %}

{% block title %}Login{% endblock %}

{% block content %}

<div class="auth-page">

    <div class="auth-card">

        <div class="page-header">

            <div>

                <h1>
                    Log in
                </h1>

                <p>
                    Sign in to continue learning.
                </p>

            </div>

        </div>


        <form method="POST">

            <div class="form-group">

                <label for="email">
                    Email
                </label>

                <input
                    id="email"
                    type="email"
                    name="email"
                    placeholder="Enter your email"
                    required
                >

            </div>


            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    id="password"
                    type="password"
                    name="password"
                    placeholder="Enter your password"
                    required
                >

            </div>


            <div class="form-actions">

                <button
                    type="submit"
                    class="button button-primary"
                >
                    Log in
                </button>

                <a
                    href="{{ url_for('register') }}"
                    class="button button-secondary"
                >
                    Create Account
                </a>

            </div>

        </form>

    </div>

</div>

{% endblock %}
