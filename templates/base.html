<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />

        <meta name="viewport" content="width=device-width, initial-scale=1.0" />

        <title>{% block title %}Course Platform{% endblock %}</title>

        <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
    </head>

    <body>
        <header class="navbar">
            <div class="navbar-left">
                <a href="{{ url_for('courses') }}" class="logo"> Course<span>Platform</span> </a>

                <a href="{{ url_for('courses') }}" class="nav-link"> Courses </a>
            </div>

            <div class="navbar-right">
                {% if current_user.is_authenticated %}

                <a href="{{ url_for('profile') }}" class="user-profile">
                    <div class="user-avatar">{{ current_user.username[0]|upper }}</div>

                    <div class="user-info">
                        <span class="username"> {{ current_user.username }} </span>

                        <span class="user-role"> {{ current_user.role }} </span>
                    </div>
                </a>

                <a href="{{ url_for('logout') }}" class="nav-link logout-link"> Logout </a>

                {% else %}

                <a href="{{ url_for('login') }}" class="nav-link"> Log in </a>

                <a href="{{ url_for('register') }}" class="button button-primary"> Sign up </a>

                {% endif %}
            </div>
        </header>

        <main class="container">{% block content %} {% endblock %}</main>

        <footer class="footer">
            <p>© 2026 Course Platform</p>
        </footer>
    </body>
</html>
