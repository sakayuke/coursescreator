{% extends "base.html" %}

{% block title %}Edit Profile{% endblock %}

{% block content %}

<div class="page-header">
    <div>
        <h1>Edit Profile</h1>
        <p>Update your account information and security settings.</p>
    </div>
</div>

<div class="form-card">
    <form method="POST">

        <div class="form-group">
            <label for="first_name">First name</label>
            <input
                id="first_name"
                type="text"
                name="first_name"
                value="{{ current_user.first_name }}"
                required
            >
        </div>

        <div class="form-group">
            <label for="last_name">Last name</label>
            <input
                id="last_name"
                type="text"
                name="last_name"
                value="{{ current_user.last_name }}"
                required
            >
        </div>

        <div class="form-group">
            <label for="email">Email</label>
            <input
                id="email"
                type="email"
                name="email"
                value="{{ current_user.email }}"
                required
            >
            <small style="display: block; margin-top: 4px; color: var(--muted, #6a6f73); font-size: 0.85rem;">
                Changing your email requires entering your current password below.
            </small>
        </div>

        <hr style="margin: 24px 0; border: 0; border-top: 1px solid var(--border, #d1d7dc);">

        <h3 style="margin-bottom: 12px; font-size: 1.1rem;">Security Verification & Password</h3>

        <div class="form-group">
            <label for="current_password">Current password</label>
            <input
                id="current_password"
                type="password"
                name="current_password"
                placeholder="Required to change email or password"
                autocomplete="current-password"
            >
        </div>

        <div class="form-group">
            <label for="new_password">New password (optional)</label>
            <input
                id="new_password"
                type="password"
                name="new_password"
                placeholder="Leave blank to keep current password"
                autocomplete="new-password"
            >
        </div>

        <div class="form-group">
            <label for="new_password_confirm">Confirm new password</label>
            <input
                id="new_password_confirm"
                type="password"
                name="new_password_confirm"
                placeholder="Re-enter new password"
                autocomplete="new-password"
            >
        </div>

        <div class="form-actions" style="margin-top: 24px;">
            <button
                type="submit"
                class="button button-primary"
            >
                Save Changes
            </button>

            <a
                href="{{ url_for('profile') }}"
                class="button button-secondary"
            >
                Cancel
            </a>
        </div>

    </form>
</div>

{% endblock %}
