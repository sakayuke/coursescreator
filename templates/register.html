{% extends "base.html" %} {% block title %}Register{% endblock %} {% block content %}

<h1>Create Account</h1>

<form method="POST">
    <label for="first_name">First name</label>
    <input id="first_name" type="text" name="first_name" placeholder="Enter your first name" required />

    <br /><br />

    <label for="last_name">Last name</label>
    <input id="last_name" type="text" name="last_name" placeholder="Enter your last name" required />

    <br /><br />

    <label for="email">Email</label>
    <input id="email" type="email" name="email" placeholder="Enter your email" required />

    <br /><br />

    <label for="password">Password</label>
    <input id="password" type="password" name="password" placeholder="Choose a password" required />

    <br /><br />

    <label for="password_confirm">Confirm password</label>
    <input id="password_confirm" type="password" name="password_confirm" placeholder="Repeat your password" required />

    <br /><br />

    <button type="submit">Sign up</button>
</form>

{% endblock %}
