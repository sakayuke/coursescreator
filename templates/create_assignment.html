{% extends "base.html" %}

{% block title %}Create Assignment{% endblock %}

{% block content %}

<div class="page-header">
    <div>
        <h1>Create Assignment</h1>
        <p>{{ course.name }} → {{ topic.name }}</p>
    </div>
</div>

<div class="form-card">
    <form method="POST">
        <div class="form-group">
            <label for="title">Title</label>
            <input
                type="text"
                id="title"
                name="title"
                required
                maxlength="150"
            >
        </div>


    <div class="form-group">
        <label for="description">Description</label>
        <textarea
            id="description"
            name="description"
            rows="8"
            required
        ></textarea>
    </div>

    <div class="form-actions">
        <button type="submit" class="button button-primary">
            Create Assignment
        </button>

        <a
            href="{{ url_for(
                'topic_materials',
                course_id=course.id,
                topic_id=topic.id
            ) }}"
            class="button button-secondary"
        >
            Cancel
        </a>
    </div>
</form>


</div>
{% endblock %}
