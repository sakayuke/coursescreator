{% extends "base.html" %}

{% block title %}Edit Assignment{% endblock %}

{% block content %}

<div class="page-header">
    <div>
        <h1>Edit Assignment</h1>
        <p>{{ course.name }} → {{ topic.name }}</p>
    </div>
</div>

<div class="form-card">
    <form method="POST">


    <div class="form-group">
        <label for="title">Title</label>

        <input
            type="text"
            id="title"
            name="title"
            value="{{ assignment.title }}"
            required
            maxlength="150"
        >
    </div>

    <div class="form-group">
        <label for="description">Description</label>

        <textarea
            id="description"
            name="description"
            rows="8"
            required
        >{{ assignment.description }}</textarea>
    </div>

    <div class="form-actions">
        <button
            type="submit"
            class="button button-primary"
        >
            Save Changes
        </button>

        <a
            href="{{ url_for(
                'assignments',
                topic_id=topic.id
            ) }}"
            class="button button-secondary"
        >
            Cancel
        </a>
    </div>

</form>


</div>
{% endblock %}
